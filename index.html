<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Counseling Studio</title><meta name="theme-color" content="#71344e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Counseling Studio"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><style>:root{--wine:#71344e;--rose:#eedde2;--bg:#fbf7f4;--ink:#352b31;--muted:#84767c;--line:#e8dfe0;--green:#e0f1e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:10px 13px}button.primary{background:var(--wine);color:white;border-color:var(--wine)}button.active{background:var(--rose);border-color:#d4aebd}.app{max-width:1250px;margin:auto;display:grid;grid-template-columns:215px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:26px 14px}.brand{font-family:Georgia,serif;color:var(--wine);font-size:22px;padding:0 10px 25px}.nav{width:100%;text-align:left;margin:3px 0;border:0;background:transparent}.nav.active{background:var(--rose);color:var(--wine);font-weight:700}.main{padding:25px 30px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px}h1{font-family:Georgia,serif;font-size:29px;font-weight:500;color:var(--wine);margin:0}h2{font-family:Georgia,serif;font-size:21px;font-weight:500;margin:0 0 16px}.sub{color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px}.card strong{display:block;font-size:25px;margin-top:12px;color:var(--wine)}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:18px}.panel{margin-bottom:15px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stack{display:flex;flex-wrap:wrap;gap:8px}.pill{border-radius:100px;padding:5px 10px;font-size:11px;background:var(--rose);color:var(--wine)}.green{background:var(--green);color:#246348}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:15px}.day{min-height:85px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;padding:8px;overflow:hidden}.day.selected{outline:2px solid var(--wine)}.day .num{font-weight:600}.day small{display:block;margin-top:7px;font-size:10px;color:var(--wine);background:var(--rose);border-radius:4px;padding:3px}.day small.av{background:var(--green);color:#246348}.dayshead{text-align:center;font-size:11px;color:var(--muted)}.item{padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff;cursor:pointer}.item:hover{border-color:var(--wine)}.hidden{display:none!important}.field{display:flex;flex-direction:column;gap:5px;margin:11px 0}.field label{font-size:12px;color:var(--muted)}input,select,textarea{border:1px solid var(--line);padding:10px;border-radius:9px;width:100%;background:white;color:var(--ink)}textarea{min-height:85px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.modalback{position:fixed;inset:0;background:#24161c88;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.modal{background:var(--bg);width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:22px}.numbers{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.number{text-align:center;padding:14px 5px;background:#f6ecef;border-radius:10px}.number strong{font-size:25px;color:var(--wine);display:block}.number small{font-size:10px;color:var(--muted)}.tab{margin-right:6px}.toast{padding:11px;background:var(--green);border- ent"></div></div></div><script>
const $=id=>document.getElementById(id);const storeKey='counseling_studio_mockup_v1';const initial={lang:'en',availability:[{date:'2026-11-05',start:'19:00',end:'22:00'},{date:'2026-11-07',start:'09:00',end:'13:00'},{date:'2026-11-08',start:'14:00',end:'18:00'}],appointments:[{id:1,client:'Client A',service:'Combined Reading',date:'2026-11-05',start:'19:30',end:'21:00',status:'Confirmed',history:[]},{id:2,client:'Client B',service:'Numerology',date:'2026-11-07',start:'10:00',end:'11:30',status:'Scheduled',history:[]},{id:3,client:'Client C',service:'Tarot',date:'2026-11-08',start:'15:00',end:'16:00',status:'Scheduled',history:[]}],clients:[{id:1,name:'Client A',nickname:'A',birth:'',place:'',time:'',issue:'Exploring personal direction and clarity.',notes:''},{id:2,name:'Client B',nickname:'B',birth:'',place:'',time:'',issue:'Seeking insight into personal patterns.',notes:''},{id:3,name:'Client C',nickname:'C',birth:'',place:'',time:'',issue:'A decision requiring reflection.',notes:''}],payments:[{id:1,client:'Client A',amount:750000,date:'2026-11-05',method:'Transfer'}],invoices:[]};let data;try{data=JSON.parse(localStorage.getItem(storeKey))||structuredClone(initial)}catch(e){data=structuredClone(initial)}data.sessionRecords ||= [];let page='dashboard',calDate='2026-11-07',calMode='month',clientId=1,clientTab='intake';const services=['Human Design','Numerology','Tarot','BaZi','Coaching / Counseling','Combined Reading','Hypnotherapy (future)'];const save=()=>localStorage.setItem(storeKey,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'Rp'+Number(n||0).toLocaleString('id-ID');const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3));const dayfmt=d=>new Date(d+'T12:00:00').toLocaleDateString(data.lang==='id'?'id-ID':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const opt=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');const times=Array.from({length:49},(_,i)=>String(Math.floor(i/2)).padStart(2,'0')+':'+(i%2?'30':'00'));function navigate(p){page=p;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));render()}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('langbtn').onclick=()=>{data.lang=data.lang==='en'?'id':'en';save();render()};function render(){let titles={dashboard:['Welcome to your studio','Selamat datang di studio'],calendar:['Calendar & availability','Kalender & ketersediaan'],clients:['Client records','Data klien'],sessions:['Session notes','Catatan sesi'],invoices:['Invoices','Invoice'],finance:['Finance & tax','Keuangan & pajak'],settings:['Settings & backup','Pengaturan & cadangan']};$('pagetitle').textContent=titles[page][data.lang==='id'?1:0];$('content').innerHTML=({dashboard:dashboard,calendar:calendar,clients:clients,sessions:sessions,invoices:invoices,finance:finance,settings:settings})[page]();if(page==='sessions')renderTemplate()}function dashboard(){return `<div class="cards"><div class="card"><span class="sub">Total clients</span><strong>${data.clients.length}</strong></div><div class="card"><span class="sub">Appointments</span><strong>${data.appointments.length}</strong></div><div class="card"><span class="sub">Received payments</span><strong>${money(data.payments.reduce((s,p)=>s+Number(p.amount),0))}</strong></div><div class="card"><span class="sub">Invoices issued</span><strong>${data.invoices.length}</strong></div></div><div class="layout"><div class="panel"><div class="row"><h2>Upcoming appointments</h2><button onclick="navigate('calendar')">Calendar →</button></div>${data.appointments.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).map(a=>`<div class="item" onclick="appointmentDetails(${a.id})"><div class="row"><b>${esc(a.client)}</b><span class="pill">${esc(a.status)}</span></div><p>${esc(a.service)} · ${dayfmt(a.date)} · ${a.start}–${a.end}</p></div>`).join('')}</div><div><div class="panel"><h2>Quick actions</h2><div class="stack"><button onclick="openAppointment()">+ Appointment</button><button onclick="openAvailability()">+ Availability</button><button onclick="newClient()">+ Client</button><button onclick="newPayment()">+ Payment</button></div></div><div class="panel"><h2>Practice notes</h2><p class="muted">Private practitioner workspace. Scheduling and payment confirmation are manual. Seven services including BaZi.</p></div></div></div>`}function calendar(){let y=Number(calDate.slice(0,4)),m=Number(calDate.slice(5,7)),first=(new Date(y,m-1,1).getDay()+6)%7,days=new Date(y,m,0).getDate();let body='';for(let i=0;i<Math.ceil((first+days)/7)*7;i++){let n=i-first+1,d=`${y}-${String(m).padStart(2,'0')}-${String(n).padStart(2,'0')}`,apps=data.appointments.filter(a=>a.date===d),av=data.availability.filter(a=>a.date===d);body+=`<button class="day ${d===calDate?'selected':''}" onclick="selectDate('${d}')" ${n<1||n>days?'disabled':''}><span class="num">${n>=1&&n<=days?n:''}</span>${apps.slice(0,2).map(a=>`<small>${a.start} ${esc(a.client)}</small>`).join('')}${av.length?`<small class="av">${av.length} open block(s)</small>`:''}</button>`}return `<div class="panel"><div class="row"><div class="stack"><button onclick="shiftMonth(-1)">‹</button><button onclick="shiftMonth(1)">›</button><b>${new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b></div><div class="stack"><button class="${calMode==='month'?'active':''}" onclick="calMode='month';render()">Month</button><button class="${calMode==='week'?'active':''}" onclick="calMode='week';render()">Week</button><button class="${calMode==='day'?'active':''}" onclick="calMode='day';render()">Day</button></div></div>${calMode==='month'?`<div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dayshead">${d}</div>`).join('')}${body}</div>`:`<div class="stack" style="margin-top:15px">${(calMode==='week'?Array.from({length:7},(_,i)=>{let dt=new Date(calDate+'T12:00:00'),w=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-w+i);return dt.toISOString().slice(0,10)}):[calDate]).map(d=>`<button class="${d===calDate?'active':''}" onclick="selectDate('${d}')">${dayfmt(d)}</button>`).join('')}</div>`}</div><div class="layout"><div class="panel"><div class="row"><h2>${dayfmt(calDate)}</h2><button onclick="openAvailability()">+ Availability</button></div><b>Open availability</b>${data.availability.filter(a=>a.date===calDate).map(a=>`<div class="item row"><span>🟢 ${a.start}–${a.end}</span><button onclick="removeAvailability(${data.availability.indexOf(a)})">Remove</button></div>`).join('')||'<p class="muted">No availability set.</p>'}<hr style="border:0;border-top:1px solid var(--line)"><b>Appointments</b>${data.appointments.filter(a=>a.date===calDate).map(a=>`<div class="item" onclick="appointmentDetails(${a.id})"><div class="row"><b>${a.start}–${a.end}</b><span class="pill">${esc(a.status)}</span></div><p>${esc(a.client)} · ${esc(a.service)}</p></div>`).join('')||'<p class="muted">No appointments.</p>'}<button class="primary" onclick="openAppointment()">+ New appointment</button></div><div class="panel"><h2>Available starting times</h2><p class="sub">For a 60-minute minimum session, every 30 minutes.</p><div class="stack">${availableStarts(calDate).map(t=>`<button onclick="openAppointment('${t}')">${t}</button>`).join('')||'<span class="muted">No 60-minute openings.</span>'}</div></div></div>`}function availableStarts(date){let out=[];for(let a of data.availability.filter(a=>a.date===date))for(let m=minutes(a.start);m+60<=minutes(a.end);m+=30){let end=m+60;if(!data.appointments.some(b=>b.date===date&&m<minutes(b.end)&&end>minutes(b.start)))out.push(times[m/30])}return [...new Set(out)]}function shiftMonth(delta){let d=new Date(calDate+'T12:00:00');d.setDate(1);d.setMonth(d.getMonth()+delta);calDate=d.toISOString().slice(0,10);render()}function selectDate(d){calDate=d;render()}function modal(title,html){$('modaltitle').textContent=title;$('modalcontent').innerHTML=html;$('overlay').classList.remove('hidden')}function closeModal(){$('overlay').classList.add('hidden')}function openAvailability(){modal('Add available hours',`<div class="field"><label>Date</label><input id="avdate" type="date" value="${calDate}"></div><div class="formgrid"><div class="field"><label>Start</label><select id="avstart">${opt(times.slice(0,-1),'19:00')}</select></div><div class="field"><label>End</label><select id="avend">${opt(times.slice(1),'22:00')}</select></div></div><p class="sub">Fully flexible availability · 30-minute increments</p><div id="formerror" class="sub"></div><button class="primary" onclick="saveAvailability()">Save availability</button>`)}function saveAvailability(){let date=$('avdate').value,start=$('avstart').value,end=$('avend').value;if(!date||minutes(end)<=minutes(start)){error('End must be after start.');return}data.availability.push({date,start,end});save();calDate=date;closeModal();render()}function removeAvailability(i){let a=data.availability[i];if(data.appointments.some(b=>b.date===a.date&&minutes(b.start)>=minutes(a.start)&&minutes(b.end)<=minutes(a.end))){alert('This availability contains a booked appointment. Reschedule the appointment before removing it.');return}data.availability.splice(i,1);save();render()}function openAppointment(start='19:00',id=null){let a=id?data.appointments.find(x=>x.id===id):{client:data.clients[0]?.name||'',service:'Numerology',date:calDate,start,end:times[Math.min(48,times.indexOf(start)+2)],status:'Scheduled'};modal(id?'Edit / reschedule appointment':'New appointment',`<div class="formgrid"><div class="field"><label>Client</label><select id="apclient">${opt(data.clients.map(c=>c.name),a.client)}</select></div><div class="field"><label>Service</label><select id="apservice">${opt(services,a.service)}</select></div></div><div class="field"><label>Date</label><input type="date" id="apdate" value="${a.date}"></div><div class="formgrid"><div class="field"><label>Start</label><select id="apstart">${opt(times.slice(0,-1),a.start)}</select></div><div class="field"><label>End</label><select id="apend">${opt(times.slice(1),a.end)}</select></div></div><div class="field"><label>Status</label><select id="apstatus">${opt(['Scheduled','Confirmed','Completed','Cancelled','Rescheduled'],a.status)}</select></div><p class="sub">Minimum 60 minutes · 30-minute increments · No overlap. Appointment must fit available hours.</p><div id="formerror" class="sub"></div><button class="primary" onclick="saveAppointment(${id||'null'})">${id?'Save reschedule':'Save appointment'}</button>`)}function error(msg){$('formerror').textContent=msg;$('formerror').style.color='#aa2448'}function saveAppointment(id){let a={client:$('apclient').value,service:$('apservice').value,date:$('apdate').value,start:$('apstart').value,end:$('apend').value,status:$('apstatus').value};if(minutes(a.end)-minutes(a.start)<60){error('Session must last at least 60 minutes.');return}if(!data.availability.some(s=>s.date===a.date&&minutes(a.start)>=minutes(s.start)&&minutes(a.end)<=minutes(s.end))){error('Outside open availability. Add availability first.');return}if(data.appointments.some(b=>b.id!==id&&b.status!=='Cancelled'&&b.date===a.date&&minutes(a.start)<minutes(b.end)&&minutes(a.end)>minutes(b.start))){error('This appointment overlaps another booking.');return}if(id){let b=data.appointments.find(x=>x.id===id);let history=b.history||[];if(b.date!==a.date||b.start!==a.start||b.end!==a.end){history.push({from:`${b.date} ${b.start}–${b.end}`,to:`${a.date} ${a.start}–${a.end}`});a.status='Rescheduled'}Object.assign(b,a,{history})}else data.appointments.push({...a,id:Date.now(),history:[]});calDate=a.date;save();closeModal();navigate('calendar')}function appointmentDetails(id){let a=data.appointments.find(x=>x.id===id);modal('Appointment details',`<p><b>${esc(a.client)}</b> · ${esc(a.service)}</p><p>${dayfmt(a.date)} · ${a.start}–${a.end}</p><span class="pill">${esc(a.status)}</span><h3>Reschedule history</h3>${(a.history||[]).map(h=>`<p class="sub">${esc(h.from)} → ${esc(h.to)}</p>`).join('')||'<p class="sub">No changes yet.</p>'}<div class="stack"><button class="primary" onclick="openAppointment('',${id})">Edit / Reschedule</button><button onclick="closeModal();navigate('sessions')">Session notes</button></div>`)}function clients(){return `<div class="panel"><div class="row"><h2>Clients</h2><button class="primary" onclick="newClient()">+ Add Client</button></div><p class="sub">Tap a client to open their private profile and complete consultation history.</p>${data.clients.map(c=>`<div class="item row"><div><b>${esc(c.name)}</b><p class="sub">${esc(c.issue)}</p><small>${data.sessionRecords.filter(r=>r.clientId===c.id).length} saved consultation(s)</small></div><button onclick="openClientProfile(${c.id})">View Profile</button></div>`).join('')}</div>`}
function openClientProfile(id,tab='history'){clientId=id;clientTab=tab;let c=data.clients.find(x=>x.id===id);modal('Client Profile · '+esc(c.name),clientProfile())}
function clientProfile(){let c=data.clients.find(x=>x.id===clientId);if(!c)return '';let records=data.sessionRecords.filter(r=>r.clientId===c.id).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="stack">${['intake','numerology','history'].map(t=>`<button class="tab ${clientTab===t?'active':''}" onclick="openClientProfile(${c.id},'${t}')">${t==='history'?'Consultation History':t==='intake'?'Personal Info':'Numerology'}</button>`).join('')}</div>${clientTab==='intake'?`<div class="field"><label>Full birth name</label><input id="cname" value="${esc(c.name)}"></div><div class="field"><label>Nickname (Basic Number)</label><input id="cnick" value="${esc(c.nickname)}"></div><div class="field"><label>Place of birth</label><input id="cplace" value="${esc(c.place)}"></div><div class="formgrid"><div class="field"><label>Date of birth</label><input type="date" id="cbirth" value="${esc(c.birth)}"></div><div class="field"><label>Time of birth</label><input type="time" id="ctime" value="${esc(c.time)}"></div></div><div class="field"><label>Initial issue / story</label><textarea id="cissue">${esc(c.issue)}</textarea></div><div class="field"><label>Practitioner summary</label><textarea id="cnotes">${esc(c.notes)}</textarea></div><button class="primary" onclick="saveClient(${c.id});openClientProfile(${c.id},'intake')">Save Client</button>`:clientTab==='numerology'?`<p class="sub">Numerology calculations are not yet implemented; values are placeholders.</p><div class="numbers">${['Life Path','Expression','Soul Urge','Birthday','Basic','Growth','Maturity','First Letter','First Vowel','Personal Year','Personal Month'].map(n=>`<div class="number"><strong>—</strong><small>${n}</small></div>`).join('')}</div>`:`<div class="row"><h3>Consultation History (${records.length})</h3><div class="row"><button onclick="exportClientPDF(${c.id},'summary')">Export Summary PDF</button><button onclick="exportClientPDF(${c.id},'full')">Export Full History PDF</button><button class="primary" onclick="newSessionForClient(${c.id})">+ New Session</button></div></div>${records.length?records.map(r=>`<div class="item"><div class="row"><div><b>${esc(r.service)}</b><p class="sub">${esc(r.date)} · ${esc(r.summary||'Saved session notes')}</p></div><button onclick="viewSession(${r.id})">View / Edit</button></div></div>`).join(''):'<p class="sub">No saved consultation notes yet. Create the first session above.</p>'}<h3>Scheduled appointments</h3>${data.appointments.filter(a=>a.client===c.name).map(a=>`<div class="item" onclick="appointmentDetails(${a.id})">${dayfmt(a.date)} · ${esc(a.service)} · ${esc(a.status)}</div>`).join('')||'<p class="sub">No appointments.</p>'}`}`}
function exportClientPDF(id,kind){
 const c=data.clients.find(x=>x.id===id);if(!c)return;
 const records=data.sessionRecords.filter(r=>r.clientId===id).sort((a,b)=>a.date.localeCompare(b.date));
 const cell=(label,value)=>`<tr><th>${esc(label)}</th><td>${esc(String(value??''))}</td></tr>`;
 const info=`<table>${cell('Full name',c.name)}${cell('Nickname',c.nickname)}${cell('Birth date',c.birth)}${cell('Birth time',c.time)}${cell('Birth place',c.place)}</table>`;
 const notes=records.map((r,i)=>{let details='';if(kind==='full'){
  const fields=r.fields||r.notes||{};
  if(Array.isArray(fields))details=fields.map(f=>Array.isArray(f)?cell(f[0],f[1]):`<p>${esc(String(f))}</p>`).join('');
  else if(typeof fields==='object')details=Object.entries(fields).map(([k,v])=>cell(k,v)).join('');
  else details=`<p>${esc(String(fields))}</p>`;
  if(details.startsWith('<tr'))details='<table>'+details+'</table>';
 }

ield"><label>Service</label><select id="templateService" onchange="renderTemplate()">${opt(services,'BaZi')}</select></div><div id="templateBody"></div></div>`}

ass="sub">Tax estimator</span><strong>Planned</strong></div></div><div class="panel" style="margin-top:15px"><div class="row"><h2>Manual payment records</h2><button class="primary" onclick="newPayment()">+ Record payment</button></div>${data.payments.map(p=>`<div class="item row"><span>${esc(p.client)} · ${esc(p.date)} · ${esc(p.method)}</span><b>${money(p.amount)}</b></div>`).join('')}<p class="sub">Personal tax, corporate withholding and PPN applicability will be configurable after tax-rule verification.</p></div>`}function newPayment(){modal('Record payment manually',`<div class="field"><label>Payer</label><input id="payer" placeholder="Client / company"></div><div class="formgrid"><div class="field"><label>Amount received (IDR)</label><input type="number" id="payamount" value="750000"></div><div class="field"><label>Payment date</label><input type="date" id="paydate" value="2026-11-04"></div></div><div class="field"><label>Method</label><select id="paymethod">${opt(['Bank transfer','QRIS','Cash'],'Bank transfer')}</select></div><button class="primary" onclick="savePayment()">Confirm manually</button>`)}function savePayment(){data.payments.push({id:Date.now(),client:$('payer').value,amount:Number($('payamount').value),date:$('paydate').value,method:$('paymethod').value});save();closeModal();render()}function settings(){return `<div class="panel"><h2>Practice configuration</h2><p><b>Booking:</b> Manual</p><p><b>Availability:</b> Fully flexible</p><p><b>Time interval:</b> 30 minutes</p><p><b>Minimum session:</b> 60 minutes</p><p><b>Payments:</b> Manual, independent of invoice printing</p><p><b>Language:</b> ${data.lang.toUpperCase()}</p><p><b>Services:</b> ${services.join(', ')}</p></div><div class="panel"><h2>Cloud Setup · Supabase (pilot)</h2><p class="sub">Optional private login and manual transfer of demo records between devices. Not automatic sync; please do not upload real client data yet.</p><a href="./cloud.html" style="display:inline-block;padding:11px 16px;border-radius:10px;background:#71344e;color:#fff;text-decoration:none">Open Cloud Setup →</a></div><div class="panel"><h2>Demo data</h2><p class="sub">This standalone mockup saves locally in this browser only. It does not provide secure cloud backup, multi-device sync, or production-grade protection for sensitive client data. Use dummy information only.</p><div class="stack"><button onclick="exportData()">Export demo JSON</button><button onclick="$('restore').click()">Restore demo JSON</button><button onclick="resetDemo()">Reset demo</button></div><input id="restore" type="file" accept="application/json" style="display:none" onchange="restoreData(event)"></div>`}function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='counseling-studio-demo-backup.json';a.click();URL.revokeObjectURL(u)}function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(!Array.isArray(obj.appointments)||!Array.isArray(obj.clients))throw Error('Invalid backup');data=obj;save();render();alert('Demo restored')}catch(e){alert('Invalid demo backup')}};r.readAsText(f)}function resetDemo(){if(confirm('Reset all mockup data?')){data=structuredClone(initial);save();render()}}render();</script><script>if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
